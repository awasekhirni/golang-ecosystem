# Grafana provisioning: dashboard loader.

apiVersion: 1

providers:
  - name: hexagonal-go
    orgId: 1
    folder: hexagonal-go
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
