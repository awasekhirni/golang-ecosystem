# Default values for the hexagonal-go Helm chart.

replicaCount: 2

image:
  repository: hexagonal-go
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Horizontal Pod Autoscaler
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# Probes — use the composite health subsystem.
probes:
  startup:
    enabled: true
    path: /healthz/startup
    failureThreshold: 30
    periodSeconds: 5
  liveness:
    enabled: true
    path: /healthz/live
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    path: /healthz/ready
    periodSeconds: 5
    failureThreshold: 2

# App config — populated from env vars (see .env.example for the full list).
config:
  app:
    env: production
    logLevel: info
    logFormat: json
  http:
    shutdownTimeout: 30s
  db:
    poolSize: 10
    maxOverflow: 20
    slowQueryMs: 100
  jwt:
    issuer: ori-inc
    accessTTL: 15m
  rate:
    limitRPS: 50
    limitBurst: 100

# Sensitive values — override via --set or a sealed secret.
secrets:
  databaseUrl: "CHANGE_ME"
  jwtSecret: "CHANGE_ME_TO_32_BYTES"
  apiKeys: "dev-key-1"

# Service account + RBAC
serviceAccount:
  create: true
  name: ""

podSecurityContext:
  fsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532

# Ingress (optional)
ingress:
  enabled: false
  className: nginx
  hosts:
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
